[project]
name = "vestigium"
version = "0.1.0"
description = "Evidence-led Indonesia satellite thermal anomaly analysis and MODIS–VIIRS harmonization."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "matplotlib>=3.8,<4",
    "scikit-learn>=1.5,<2",
    "pyproj>=3.6,<4",
    "joblib>=1.3,<2",
    "jupyterlab>=4.2,<5",
    "ipython>=8.20,<10",
    "geopandas>=1.0,<2",
]

[tool.uv]
package = false
