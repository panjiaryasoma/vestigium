name: Bootstrap uv lockfile

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - ".python-version"
      - ".github/workflows/uv-lock-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-lock:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: "3.11"
      - name: Generate and verify uv lockfile
        run: |
          uv lock
          uv lock --check
          uv sync --locked
      - name: Commit lockfile if changed
        run: |
          if ! git diff --quiet -- uv.lock || [ -n "$(git ls-files --others --exclude-standard uv.lock)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add uv.lock
            git commit -m "build(uv): generate committed dependency lockfile"
            git push origin HEAD:main
          else
            echo "uv.lock already matches pyproject.toml."
          fi
