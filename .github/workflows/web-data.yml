name: Generate NASA FIRMS compact web data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/export_web_data.py"
      - ".github/workflows/web-data.yml"
      - "data/**"
permissions:
  contents: write
concurrency:
  group: web-data-export
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate real FIRMS map samples
        run: python scripts/export_web_data.py
      - name: Verify sample bundle
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("app/api/data")
          i=json.loads((root/"monthly_index.json").read_text())
          assert i["source_total"] == 5997676
          assert len(list((root/"samples").glob("*.json"))) == 26
          assert sum(r["detection_count"] for r in i["months"]) == i["source_total"]
          assert all(not p["synthetic"] for y in (2000, 2015, 2025) for m in json.loads((root/"samples"/f"{y}.json").read_text()).values() for p in m)
          print("Verified", i["map_points_sampled"], "real points")
          PY
      - name: Commit deployable data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f app/api/data/monthly_index.json app/api/data/quality_report.json app/api/data/samples/*.json
          if ! git diff --cached --quiet; then
            git commit -m "data: generate genuine NASA FIRMS web archive"
            git push
          fi
