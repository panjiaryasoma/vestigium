name: VESTIGIUM Python CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "notebooks/**"
      - "pyproject.toml"
      - ".python-version"
      - "uv.lock"
      - ".github/workflows/python-ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "notebooks/**"
      - "pyproject.toml"
      - ".python-version"
      - "uv.lock"
      - ".github/workflows/python-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install uv and Python 3.11
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: "3.11"
      - name: Verify dependency lock
        run: uv lock --check
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Compile Python source and tests
        run: uv run --locked python -m compileall -q src tests
      - name: Run unit and integration tests
        run: uv run --locked python -m unittest discover -s tests -v
      - name: Check notebook JSON format
        run: |
          uv run --locked python - <<'PY'
          import json
          import pathlib
          files = list(pathlib.Path("notebooks").rglob("*.ipynb"))
          assert files, "No notebooks found"
          for path in files:
              notebook = json.loads(path.read_text(encoding="utf-8"))
              assert notebook["nbformat"] == 4 and isinstance(notebook["cells"], list), path
              print(path, len(notebook["cells"]), "cells")
          PY
