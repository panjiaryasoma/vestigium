<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="650" viewBox="0 0 1080 650" role="img" aria-label="The detection blind spot">
<title>The detection blind spot</title><desc>2013–2025  ·  VIIRS S-NPP detection share by MODIS co-presence</desc><rect width="1080" height="650" fill="#0b1016"/>
<rect x="30" y="30" width="1020" height="590" fill="none" stroke="#323943" stroke-width="1"/>
<text x="72" y="92" fill="#f15b5d" font-family="Arial, sans-serif" font-size="15" letter-spacing="4">VESTIGIUM  /  MODEL EVIDENCE</text>
<text x="72" y="146" fill="#f4f4f1" font-family="Arial, sans-serif" font-size="35" font-weight="700">The detection blind spot</text>
<text x="72" y="181" fill="#9da7b2" font-family="Arial, sans-serif" font-size="17">2013–2025  ·  VIIRS S-NPP detection share by MODIS co-presence</text><text x="72" y="257" font-family="Arial" font-size="19" fill="#d6dce2">VIIRS detections within MODIS-positive grid-months</text>
<rect x="72" y="280" width="920" height="100" fill="#26333c"/>
<rect x="72" y="280" width="824.32" height="100" fill="#7ca5aa"/>
<rect x="896.32" y="280" width="95.67999999999999" height="100" fill="#f15b5d"/>
<text x="92" y="345" fill="#0b1016" font-family="Arial" font-size="39" font-weight="700">89.6%</text><text x="901" y="344" fill="#fff" font-family="Arial" font-size="24" font-weight="700">10.4%</text>
<text x="72" y="427" fill="#9ba9b4" font-family="Arial" font-size="19">10.4% of S-NPP detections fall outside MODIS-positive grid-months.</text>
<text x="72" y="464" fill="#9ba9b4" font-family="Arial" font-size="19">These cannot be recovered by a MODIS-positive-only calibration.</text>
<rect x="72" y="493" width="920" height="46" fill="#1a232d"/>
<text x="91" y="523" fill="#efc79a" font-family="Arial" font-size="18">2022: only 60.2% of S-NPP detections had MODIS-positive co-presence.</text><line x1="72" y1="556" x2="1008" y2="556" stroke="#323943"/><text x="72" y="586" fill="#9da7b2" font-family="Arial, sans-serif" font-size="14">Co-presence means same cell/month, not identical fire event or orbit</text></svg>